[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-trust-qa"
version = "0.1.0"
description = "Synthetic data generation and QA practice for data reconciliation."
requires-python = ">=3.12,<3.14"
dependencies = [
    "python-dotenv>=1.0,<2",
]

[project.scripts]
data-trust-generate = "data_trust_qa.commands.generate:main"
data-trust-bootstrap = "data_trust_qa.commands.bootstrap:main"
data-trust-process-b = "data_trust_qa.commands.process_b:main"

[tool.setuptools]
package-dir = {"" = "generator/src"}

[tool.setuptools.packages.find]
where = ["generator/src"]
